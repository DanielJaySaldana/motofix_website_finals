<!-- Home — styles: src/promotional/home.css -->
<section class="promo-hero" id="home" aria-labelledby="hero-title">
  <!-- Debug hero anchor: the header Home link uses href="#home". Keep this section ID unchanged or update the header link at the same time. -->
  <div class="promo-container promo-hero-layout">
    <div class="promo-hero-copy">
      <h1 id="hero-title">Your repair<br /><span>Made clear</span></h1>
      <p class="promo-hero-tagline">Save Time, Less Stress, and Fix Smarter</p>
      <div class="promo-actions" hidden="">
      <!-- Debug hidden CTA: the browser suppresses this whole group because of the hidden attribute. If the demo links should appear, check this attribute; changing margins or colors will not reveal it. -->
        <a class="promo-button" href="/preview"
          >Explore the demo
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-up-right"
            aria-hidden="true"
          >
            <path d="M7 7h10v10"></path>
            <path d="M7 17 17 7"></path></svg></a
        ><a class="promo-watch-link" href="#see-it-in-action"
          ><span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-play"
              aria-hidden="true"
            >
              <path
                d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
              ></path></svg
          ></span>
          <!-- -->Watch our story</a
        >
      </div>
      <div class="promo-hero-caption">
        <a href="#features" aria-label="Scroll to features"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-arrow-down"
            aria-hidden="true"
          >
            <path d="M12 5v14"></path>
            <path d="m19 12-7 7-7-7"></path>
          </svg>
          Discover what’s inside</a
        >
      </div>
    </div>
    <div class="promo-hero-visual">
      <div class="promo-hero-photo">
        <img
          alt="A motorcyclist riding along an open road at dusk"
          fetchpriority="high"
          loading="lazy"
          width="1800"
          height="1200"
          decoding="async"
          data-nimg="1"
          srcset="/promo/road-at-dusk.jpg 1x, /promo/road-at-dusk.jpg 2x"
          src="/promo/road-at-dusk.jpg"
        />
      </div>
      <div class="promo-hero-phone">
        <div class="promo-phone">
          <div class="promo-phone-camera"></div>
          <img
            alt="MotoFix welcome artwork with a rider and mechanic on mobile"
            loading="eager"
            width="390"
            height="844"
            decoding="async"
            data-nimg="1"
            srcset="
              /promo/splash/welcome-mobile.png?v=5.1 1x,
              /promo/splash/welcome-mobile.png?v=5.1 2x
            "
            src="/promo/splash/welcome-mobile.png?v=5.1"
          />
          <div class="promo-phone-indicator"></div>
        </div>
      </div>
      <a class="promo-hero-seal" href="#features" aria-label="Explore the MotoFix platform"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          width="37"
          height="37"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-arrow-down-right"
          aria-hidden="true"
        >
          <path d="m7 7 10 10"></path>
          <path d="M17 7v10H7"></path></svg></a
      ><span class="promo-hero-corner" aria-hidden="true"></span>
    </div>
  </div>
</section>
